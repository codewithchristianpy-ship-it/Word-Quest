<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Quest: Cognitive Brain Trainer</title>
    <style>
        :root {
            --primary: #a855f7;
            --primary-dark: #6b21a8;
            --bg: #faf5ff;
            --card-border: #f3e8ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border: 4px solid var(--card-border);
            border-radius: 28px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 12px 24px rgba(107, 33, 168, 0.08);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2.2rem;
            margin: 0 0 5px 0;
        }

        .voice-selector-box {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #6b7280;
            display: block;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #e9d5ff;
            background: white;
            font-size: 0.95rem;
            color: #4c1d95;
            outline: none;
            cursor: pointer;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: #faf5ff;
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px solid #f3e8ff;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .streak { color: #ea580c; }
        .score { color: #2563eb; }

        .audio-box {
            background: #fdf4ff;
            border: 3px dashed var(--primary);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-speak {
            background: #a855f7;
            color: white;
            box-shadow: 0 5px 0px #7e22ce;
            margin-bottom: 10px;
            width: 100%;
        }

        .btn-speak:active { transform: translateY(4px); box-shadow: 0 1px 0px #7e22ce; }

        .btn-hint {
            background: #e2e8f0;
            color: #334155;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.5rem;
            text-align: center;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            text-transform: uppercase;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 2px;
        }

        .btn-check {
            width: 100%;
            background: #2563eb;
            color: white;
            box-shadow: 0 5px 0px #1d4ed8;
            margin-top: 10px;
            font-size: 1.3rem;
        }

        .btn-check:active { transform: translateY(4px); box-shadow: 0 1px 0px #1d4ed8; }

        .feedback { font-size: 1.4rem; font-weight: bold; margin-top: 15px; min-height: 35px; }
        .correct { color: #16a34a; animation: bounce 0.4s ease; }
        .wrong { color: #dc2626; animation: shake 0.4s ease; }

        @keyframes bounce { 50% { transform: scale(1.05); } }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>

    <canvas id="confetti" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:999;"></canvas>

    <div class="game-container">
        <h1>🧠 Word Quest Pro</h1>
        <p style="color: #6b7280; margin-top: 5px; margin-bottom: 15px;">Cognitive Brain Exercise Mode</p>

        <!-- Voice Accent Configuration Component -->
        <div class="voice-selector-box">
            <label for="voice-select">🗣️ Select Speaker Accent:</label>
            <select id="voice-select">
                <option value="en-US">American English</option>
                <option value="en-GB">British English</option>
            </select>
        </div>

        <div class="score-board">
            <span class="score">⭐ Score: <span id="score-val">0</span></span>
            <span class="streak">🔥 Streak: <span id="streak-val">0</span></span>
        </div>

        <div class="audio-box">
            <button class="btn btn-speak" id="listen-btn">🔊 Listen to Word</button>
            <br>
            <button class="btn btn-hint" id="hint-btn">Help me spell</button>
        </div>

        <div class="input-zone">
            <input type="text" id="user-input" placeholder="TYPE HERE..." autocomplete="off">
            <button class="btn btn-check" id="check-btn">Verify Answer</button>
        </div>

        <div class="feedback" id="feedback-msg"></div>
    </div>

    <script>
        // High-entropy vocabulary dataset curated for neurological cognitive stimulation
        const brainExerciseWords = [
            "paradox", "quantum", "matrix", "horizon", "velocity", "spectrum", "symmetry", "illusion",
            "catalyst", "synergy", "dynamic", "abstract", "harmonic", "infinite", "graphene", "traverse",
            "acoustic", "kinetic", "resonance", "alchemy", "vortex", "nebula", "protocol", "cerebral",
            "monolith", "synthetic", "frequency", "bionic", "algorithm", "entropy", "eclipse", "optics"
        ];

        const wordPool = [];
        for (let i = 0; i < 30; i++) { brainExerciseWords.forEach(w => wordPool.push(w)); }

        let currentWord = "";
        let score = 0;
        let streak = 0;
        let browserVoices = [];

        const listenBtn = document.getElementById('listen-btn');
        const hintBtn = document.getElementById('hint-btn');
        const checkBtn = document.getElementById('check-btn');
        const userInput = document.getElementById('user-input');
        const feedbackMsg = document.getElementById('feedback-msg');
        const scoreVal = document.getElementById('score-val');
        const streakVal = document.getElementById('streak-val');
        const voiceSelect = document.getElementById('voice-select');

        // Dynamically parse system speech voice objects
        function loadSystemVoices() {
            if ('speechSynthesis' in window) {
                browserVoices = window.speechSynthesis.getVoices();
            }
        }
        
        loadSystemVoices();
        if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadSystemVoices;
        }

        function nextWord() {
            currentWord = wordPool[Math.floor(Math.random() * wordPool.length)];
            userInput.value = "";
            feedbackMsg.textContent = "";
            feedbackMsg.className = "feedback";
            triggerSpeech(currentWord);
        }

        function triggerSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Fetch target accent code configured via the dropdown selection
                const targetLang = voiceSelect.value;
                utterance.lang = targetLang;
                
                // Matches exact regional system voice profile signatures
                const matchedVoice = browserVoices.find(v => v.lang.startsWith(targetLang));
                if (matchedVoice) utterance.voice = matchedVoice;

                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer() {
            const playerGuess = userInput.value.trim().toLowerCase();
            if (!playerGuess) return;

            if (playerGuess === currentWord.toLowerCase()) {
                score += 20; streak += 1;
                scoreVal.textContent = score; streakVal.textContent = streak;
                feedbackMsg.textContent = "🎯 Target Identified! Correct!";
                feedbackMsg.className = "feedback correct";
                
                burstConfetti();
                triggerSpeech("Correct");
                setTimeout(nextWord, 1800);
            } else {
                streak = 0; streakVal.textContent = streak;
                feedbackMsg.textContent = "⚡ Error: Recalibrating!";
                feedbackMsg.className = "feedback wrong";
                triggerSpeech("Incorrect");
            }
        }

        hintBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const spelling = currentWord.split('').join('... ');
                const utterance = new SpeechSynthesisUtterance(`Spelling... ${spelling}`);
                utterance.lang = voiceSelect.value;
                utterance.rate = 0.75;
                window.speechSynthesis.speak(utterance);
            }
        });
