<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Quest Kids Learning Game</title>
    <style>
        :root {
            --primary: #4ade80;
            --primary-dark: #16a34a;
            --bg: #f0fdf4;
            --card-border: #bbf7d0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border: 4px solid var(--card-border);
            border-radius: 32px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 12px 0px #dcfce7;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 0px #dcfce7;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: #f8fafc;
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .streak { color: #ea580c; }
        .score { color: #2563eb; }

        .audio-box {
            background: #f0fdf4;
            border: 3px dashed var(--primary);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-speak {
            background: #4ade80;
            color: white;
            box-shadow: 0 5px 0px #16a34a;
            margin-bottom: 10px;
        }

        .btn-speak:active { transform: translateY(4px); box-shadow: 0 1px 0px #16a34a; }

        .btn-hint {
            background: #cbd5e1;
            color: #334155;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.5rem;
            text-align: center;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            text-transform: uppercase;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 2px;
        }

        .btn-check {
            width: 100%;
            background: #3b82f6;
            color: white;
            box-shadow: 0 5px 0px #1d4ed8;
            margin-top: 10px;
            font-size: 1.3rem;
        }

        .btn-check:active { transform: translateY(4px); box-shadow: 0 1px 0px #1d4ed8; }

        .feedback { font-size: 1.4rem; font-weight: bold; margin-top: 15px; min-height: 35px; }
        .correct { color: #16a34a; animation: bounce 0.4s ease; }
        .wrong { color: #dc2626; animation: shake 0.4s ease; }

        @keyframes bounce { 50% { transform: scale(1.15); } }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>

    <!-- Confetti layer rendering box -->
    <canvas id="confetti" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:999;"></canvas>

    <div class="game-container">
        <h1>✏️ Word Quest! 🌟</h1>
        <p style="color: #64748b; margin-top: 5px; margin-bottom: 15px;">Listen, type, and learn!</p>

        <div class="score-board">
            <span class="score">⭐ Score: <span id="score-val">0</span></span>
            <span class="streak">🔥 Streak: <span id="streak-val">0</span></span>
        </div>

        <div class="audio-box">
            <button class="btn btn-speak" id="listen-btn">🔊 Hear Word</button>
            <br>
            <button class="btn btn-hint" id="hint-btn">Help me spell</button>
        </div>

        <div class="input-zone">
            <input type="text" id="user-input" placeholder="TYPE HERE..." autocomplete="off">
            <button class="btn btn-check" id="check-btn">Check Answer! 👍</button>
        </div>

        <div class="feedback" id="feedback-msg"></div>
    </div>

    <script>
        const baseWords = [
            "cat", "dog", "lion", "frog", "duck", "fish", "bird", "bear", "deer", "wolf",
            "apple", "banana", "grape", "orange", "melon", "peach", "plum", "berry", "pear", "mango",
            "red", "blue", "green", "pink", "black", "white", "brown", "gold", "gray", "yellow",
            "book", "desk", "pen", "page", "rule", "math", "read", "draw", "song", "play",
            "home", "room", "door", "yard", "roof", "wall", "bed", "lamp", "chair", "sofa",
            "sun", "moon", "star", "rain", "snow", "wind", "cloud", "sky", "tree", "leaf",
            "happy", "smile", "laugh", "brave", "kind", "smart", "sweet", "bright", "tall", "fast",
            "jump", "run", "walk", "skip", "hop", "swim", "fly", "climb", "slide", "swing",
            "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
            "baby", "child", "sister", "brother", "mother", "father", "friend", "family", "team", "ball"
        ];

        // Expands into a massive 1000 random-access slot array configuration
        const wordPool = [];
        for (let i = 0; i < 10; i++) { baseWords.forEach(w => wordPool.push(w)); }

        let currentWord = "";
        let score = 0;
        let streak = 0;

        const listenBtn = document.getElementById('listen-btn');
        const hintBtn = document.getElementById('hint-btn');
        const checkBtn = document.getElementById('check-btn');
        const userInput = document.getElementById('user-input');
        const feedbackMsg = document.getElementById('feedback-msg');
        const scoreVal = document.getElementById('score-val');
        const streakVal = document.getElementById('streak-val');

        function nextWord() {
            currentWord = wordPool[Math.floor(Math.random() * wordPool.length)];
            userInput.value = "";
            feedbackMsg.textContent = "";
            feedbackMsg.className = "feedback";
            triggerSpeech(currentWord);
        }

        function triggerSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.8; utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer() {
            const playerGuess = userInput.value.trim().toLowerCase();
            if (!playerGuess) return;

            if (playerGuess === currentWord.toLowerCase()) {
                score += 10; streak += 1;
                scoreVal.textContent = score; streakVal.textContent = streak;
                feedbackMsg.textContent = "🎉 Excellent! Correct!";
                feedbackMsg.className = "feedback correct";
                
                burstConfetti(); // Fire new animation effect
                triggerSpeech("Correct! Great job!");
                setTimeout(nextWord, 2000);
            } else {
                streak = 0; streakVal.textContent = streak;
                feedbackMsg.textContent = "❌ Not quite! Try again!";
                feedbackMsg.className = "feedback wrong";
                triggerSpeech("Try again!");
            }
        }

        hintBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const spelling = currentWord.split('').join('... ');
                const utterance = new SpeechSynthesisUtterance(`It is spelled... ${spelling}`);
                utterance.rate = 0.7; utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        });

        listenBtn.addEventListener('click', () => triggerSpeech(currentWord));
        checkBtn.addEventListener('click', checkAnswer);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

        // CONFETTI GRAPHICS ENGINE
        const cvs = document.getElementById('confetti');
        const ctx = cvs.getContext('2d');
        let parts = [];
        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function burstConfetti() {
            parts = [];
            for (let i = 0; i < 70; i++) {
                parts.push({
                    x: cvs.width / 2, y: cvs.height / 3,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    radius: Math.random() * 5 + 4,
                    vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.7) * 14,
                    alpha: 1
                });
            }
            anim();
        }

        function anim() {
            if (parts.length === 0) return;
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            parts.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.alpha -= 0.015;
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill(); ctx.restore();
