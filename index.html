<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Mind Gym & Learning Quest</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --primary: #a855f7;
            --primary-dark: #6b21a8;
            --shadow: rgba(107, 33, 168, 0.06);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .control-item {
            flex: 1;
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text);
            opacity: 0.8;
        }

        select, .btn-toggle {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .btn-toggle {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-card {
            background: var(--card-bg);
            border: 3px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 20px var(--shadow);
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Brain Exercise Styles */
        .score-board {
            display: flex;
            justify-content: space-around;
            background: var(--bg);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .audio-box {
            background: var(--bg);
            border: 2px dashed var(--primary);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-sub {
            background: #cbd5e1;
            color: #334155;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.3rem;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text);
            text-transform: uppercase;
            box-sizing: border-box;
            outline: none;
        }

        /* Song & Rhythm Area */
        .song-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-card {
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-title {
            font-weight: bold;
            text-align: left;
        }

        .btn-play {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <!-- Top Master Control Grid -->
    <div class="header-controls">
        <div class="control-item">
            <label for="voice-select">🗣️ ACCENT SWITCH</label>
            <select id="voice-select">
                <option value="en-US">American English</option>
                <option value="en-GB">British English</option>
            </select>
        </div>
        <div class="control-item">
            <label>🌓 THEME SWITCH</label>
            <button class="btn-toggle" id="theme-btn">Toggle Dark Mode</button>
        </div>
    </div>

    <!-- Main Dynamic Application Container -->
    <div class="main-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('game-tab')">🧠 Brain Trainer</button>
            <button class="tab-btn" onclick="switchTab('rhythm-tab')">🎵 Nursery Rhythm</button>
        </div>

        <!-- PANEL 1: Cognitive Word Quest Core Game -->
        <div id="game-tab" class="panel active">
            <h2 style="margin-top:0;">Word Quest Gym</h2>
            <div class="score-board">
                <span style="color:#2563eb;">⭐ Score: <span id="score-val">0</span></span>
                <span style="color:#ea580c;">🔥 Streak: <span id="streak-val">0</span></span>
            </div>
            <div class="audio-box">
                <button class="btn-main" id="listen-btn">🔊 Listen To Word</button>
                <button class="btn-sub" id="hint-btn">Help me spell</button>
            </div>
            <div class="input-zone">
                <input type="text" id="user-input" placeholder="Type answer here..." autocomplete="off">
                <button class="btn-main" id="check-btn" style="margin-top:12px; background:#2563eb; box-shadow: 0 4px 0 #1d4ed8;">Verify Word</button>
            </div>
            <div class="feedback" id="feedback-msg"></div>
        </div>

        <!-- PANEL 2: Interactive Rhythm and Media Area -->
        <div id="rhythm-tab" class="panel">
            <h2 style="margin-top:0;">Primary School rhythms</h2>
            <div class="song-grid">
                <div class="song-card">
                    <div class="song-title">🔤 The Alphabet Song<br><span style="font-size:0.8rem; opacity:0.7;">Learn your A-B-C letters</span></div>
                    <button class="btn-play" onclick="playRhythm('alphabet')">▶ Play</button>
                </div>
                <div class="song-card">
                    <div class="song-title">🔢 The Number Counter Rhythm<br><span style="font-size:0.8rem; opacity:0.7;">Counting from 1 to 10</span></div>
                    <button class="btn-play" onclick="playRhythm('numbers')">▶ Play</button>
                </div>
            </div>
        </div>
    </div>
